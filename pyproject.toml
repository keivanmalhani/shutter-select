[project]
name = "shutter-select"
version = "0.1.0"
description = "Local-first video culling: transcribe, score, and hand your editor a ready-made selects timeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Keivan Malhani" }]
keywords = [
    "video-editing",
    "selects",
    "whisper",
    "scene-detection",
    "opentimelineio",
    "post-production",
]
dependencies = [
    "faster-whisper>=1.0.0,<2.0.0",
    "scenedetect>=0.7.0,<0.8.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    # OTIO moved its EDL and FCP7 XML adapters out of core into plugin
    # packages; these three together provide otio_json, cmx_3600 and
    # fcp_xml. Verified against OTIO 0.18.1 in the build session.
    "opentimelineio>=0.17.0,<0.19.0",
    "otio-cmx3600-adapter>=1.0",
    "otio-fcp-adapter>=1.0",
]

[project.scripts]
shutter-select = "shutter_select.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shutter_select"]

[tool.pytest.ini_options]
markers = [
    "integration: slow tests that run real transcription, excluded in CI",
]
addopts = "-m 'not integration'"
